[project]
name = "harvest-loop"
version = "0.1.0"
description = "Autonomous Farm Inspection Planning Platform — learning build"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-ollama>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6.9",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvest_loop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
